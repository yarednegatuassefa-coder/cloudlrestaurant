# Optional local OSRM service for development and staging.
# Prepare the .osrm dataset first; see docs/osrm-routing.md.
services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:26.10.0-debian
    command: ["osrm-routed", "--algorithm", "mld", "/data/ethiopia-latest.osrm"]
    volumes:
      - ./data/osrm:/data:ro
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped
    profiles: ["routing"]
