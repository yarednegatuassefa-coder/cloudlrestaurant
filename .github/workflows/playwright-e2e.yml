name: Playwright E2E

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end and visual regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API validation unit tests
        run: npm run test:api

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run E2E tests and visual snapshots
        run: npm run test:e2e

      - name: Run PWA installability and offline privacy smoke test
        run: npm run test:pwa
