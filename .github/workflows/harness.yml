name: CloudL Harness CI

on:
  pull_request:
    branches: [main, feat/sms-notification-outbox]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudl-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Harness preflight
        run: npm run harness:check
      - name: Lint
        run: npm run lint
      - name: API tests
        run: npm run test:api
      - name: Production build
        run: npm run build
